apiVersion: apps/v1
kind: Deployment
metadata:
  name: deckforge
  labels:
    app: deckforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deckforge
  template:
    metadata:
      labels:
        app: deckforge
    spec:
      containers:
        - name: deckforge
          image: deckforge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8431
          readinessProbe:
            httpGet:
              path: /health
              port: 8431
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: deckforge
spec:
  selector:
    app: deckforge
  ports:
    - port: 8431
      targetPort: 8431
  type: ClusterIP
